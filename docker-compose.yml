version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sap_postgres
    environment:
      POSTGRES_DB: sap_bills
      POSTGRES_USER: sapuser
      POSTGRES_PASSWORD: sappass
    ports:
      - "5432:5432"
    volumes:
      - sap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapuser -d sap_bills"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  sap_pgdata:
    driver: local
